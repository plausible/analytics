[files]
extend-exclude = [
	".git/",
	"**/*.json",
	"**/*.yml",
	"**/*.csv",
	"**/*.xml",
	"**/*.html",
	"tracker/eslint.config.mjs"
]
ignore-hidden = false

[default]
extend-ignore-re = [
	"\\bUku Taht\\b",
	"Urfahr -> Linz",
	"GOOGLE_CLIENT_SECRET=.+",
	"\\bfo\\.wikipedia\\.org\\b",
	'RecoveryCode.disambiguate\(".+"\) == ".+"',
	"ot-",
	".+UE.*",
	"IST",
	"nd",
	"abck",
	"OT",
	"Pn",
	"ot",
	"taht",
	"Taht",
	"linz",
	"Linz"
]

[default.extend-words]
"referers" = "referers"

[default.extend-identifiers]
# Typos
"GitHub" = "GitHub"
