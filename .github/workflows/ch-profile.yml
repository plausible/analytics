# TEMPORARY: profiles ClickHouse service-container startup variants on
# Blacksmith runners. Remove before merging the PR.
name: ClickHouse startup profile

on:
  push:
    branches: [ci/faster-service-health-checks]

concurrency:
  group: ch-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: "CH profile (${{ matrix.variant }})"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: alpine-baseline
            image: clickhouse/clickhouse-server:25.11.5.8-alpine
            nologs: "false"
            tmpfs: "false"
          - variant: alpine-nologs
            image: clickhouse/clickhouse-server:25.11.5.8-alpine
            nologs: "true"
            tmpfs: "false"
          - variant: alpine-tmpfs
            image: clickhouse/clickhouse-server:25.11.5.8-alpine
            nologs: "false"
            tmpfs: "true"
          - variant: alpine-nologs-tmpfs
            image: clickhouse/clickhouse-server:25.11.5.8-alpine
            nologs: "true"
            tmpfs: "true"
          - variant: nonalpine-baseline
            image: clickhouse/clickhouse-server:25.11.5.8
            nologs: "false"
            tmpfs: "false"
          - variant: nonalpine-nologs-tmpfs
            image: clickhouse/clickhouse-server:25.11.5.8
            nologs: "true"
            tmpfs: "true"
    steps:
      - name: Write nologs config
        if: matrix.nologs == 'true'
        run: |
          mkdir -p /tmp/chcfg
          cat > /tmp/chcfg/zz-disable-logs.xml <<'EOF'
          <clickhouse>
              <query_log remove="1"/>
              <query_thread_log remove="1"/>
              <query_views_log remove="1"/>
              <part_log remove="1"/>
              <trace_log remove="1"/>
              <text_log remove="1"/>
              <metric_log remove="1"/>
              <error_log remove="1"/>
              <latency_log remove="1"/>
              <query_metric_log remove="1"/>
              <asynchronous_metric_log remove="1"/>
              <opentelemetry_span_log remove="1"/>
              <session_log remove="1"/>
              <processors_profile_log remove="1"/>
              <asynchronous_insert_log remove="1"/>
              <backup_log remove="1"/>
              <blob_storage_log remove="1"/>
              <s3queue_log remove="1"/>
              <crash_log remove="1"/>
          </clickhouse>
          EOF

      - name: Profile startup
        run: |
          set -uo pipefail
          IMAGE="${{ matrix.image }}"
          NOLOGS="${{ matrix.nologs }}"
          TMPFS="${{ matrix.tmpfs }}"
          VARIANT="${{ matrix.variant }}"

          t0=$(date +%s.%N)
          docker pull "$IMAGE" > /dev/null
          t1=$(date +%s.%N)
          echo "PROFILE variant=$VARIANT pull_seconds=$(awk "BEGIN{printf \"%.2f\", $t1-$t0}")"

          run_once() {
            local phase=$1
            local args=(-d -p 8123:8123 -e CLICKHOUSE_SKIP_USER_SETUP=1)
            [ "$NOLOGS" = "true" ] && args+=(-v /tmp/chcfg/zz-disable-logs.xml:/etc/clickhouse-server/config.d/zz-disable-logs.xml:ro)
            [ "$TMPFS" = "true" ] && args+=(--tmpfs /var/lib/clickhouse:rw,mode=0777,size=2g)
            local s0 cid s1 ready
            s0=$(date +%s.%N)
            cid=$(docker run "${args[@]}" "$IMAGE")
            for i in $(seq 1 1200); do
              curl -fsS -o /dev/null http://127.0.0.1:8123/ping 2>/dev/null && break
              sleep 0.1
            done
            s1=$(date +%s.%N)
            ready=$(awk "BEGIN{printf \"%.2f\", $s1-$s0}")

            # gap between docker run and entrypoint's first output (hydration cost)
            local started firstlog gap
            started=$(docker inspect --format '{{.State.StartedAt}}' "$cid")
            firstlog=$(docker logs --timestamps "$cid" 2>&1 | head -1 | awk '{print $1}')
            gap=$(python3 -c "
          from datetime import datetime
          def p(t): return datetime.fromisoformat(t.replace('Z','+00:00'))
          try: print(f\"{(p('$firstlog')-p('$started')).total_seconds():.2f}\")
          except Exception: print('nan')")

            # verify the server is actually usable (esp. under tmpfs)
            local ok=yes
            curl -fsS "http://127.0.0.1:8123/" --data "CREATE TABLE default.t_profile (x UInt8) ENGINE=MergeTree ORDER BY x" || ok=no
            curl -fsS "http://127.0.0.1:8123/" --data "INSERT INTO default.t_profile VALUES (1)" || ok=no
            [ "$(curl -fsS "http://127.0.0.1:8123/" --data 'SELECT count() FROM default.t_profile')" = "1" ] || ok=no
            local ntables
            ntables=$(curl -fsS "http://127.0.0.1:8123/" --data "SELECT count() FROM system.tables WHERE database='system' AND engine LIKE '%MergeTree%'")

            echo "PROFILE variant=$VARIANT phase=$phase ready_seconds=$ready exec_gap_seconds=$gap usable=$ok system_mt_tables=$ntables"
            docker rm -f "$cid" > /dev/null
          }

          run_once cold
          run_once warm1
          run_once warm2
