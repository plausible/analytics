name: Elixir CI

on:
  pull_request:
  push:
    branches: [master, stable]
  merge_group:

# Superseded pull request runs are cancelled. Pushes to master/stable get a
# group per commit, so they are never cancelled or replaced while queued:
# every landed commit gets a result and saves a fresh build cache.
# Merge-queue refs are unique per entry already.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHE_VERSION: v19
  PERSISTENT_CACHE_DIR: cached
  # CI never acts on npm's audit report, and it makes every npm install and
  # npm ci wait on npmjs.org's audit endpoint (39 s per call on 4 Oct 2026).
  npm_config_audit: "false"
  npm_config_fund: "false"

jobs:
  build:
    # Every matrix job needs a unique name: the "All checks pass" gate keeps only
    # the most recently started check run per name, so duplicates hide failures.
    name: "Build and test (${{ matrix.mix_env }}, ${{ matrix.postgres_image }}, ${{ matrix.mix_test_partition }})"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      matrix:
        mix_env: ["test", "ce_test"]
        postgres_image: ["postgres:18"]
        mix_test_partition: [1, 2, 3, 4, 5, 6]

    env:
      MIX_ENV: ${{ matrix.mix_env }}
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
      clickhouse:
        image: clickhouse/clickhouse-server:25.11.5.8-alpine
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      # Pull requests and merge-queue entries restore the newest master snapshot.
      # Only master pushes save (see the end of the job), so the snapshot follows
      # master instead of freezing until mix.lock changes.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: build-cache
        with:
          path: |
            deps
            _build
            tracker/node_modules
            priv/tracker/js
            priv/tracker/installation_support
            ${{ env.PERSISTENT_CACHE_DIR }}
          key: ${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-${{ hashFiles('mix.lock') }}-
            ${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-

      # The path list matches the caches saved before this workflow, so their
      # snapshots keep restoring (the cache version is a hash of the paths).
      # Those snapshots also carry the committed priv/tracker/js/p.js, so put
      # this commit's copy back.
      - run: git checkout -- priv/tracker

      # The tracker bundle is compiled into PlausibleWeb.Tracker, so it must be
      # built from this commit's tracker sources. Keying it on those sources
      # replaces the old "did this diff touch tracker/**" check, which reused a
      # stale bundle whenever tracker changes landed after the cache snapshot.
      # CE builds skip the ee_only variants (tracker/compiler/index.js), hence
      # the edition in the key.
      - name: Restore tracker bundle
        id: tracker-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            priv/tracker/js/plausible*.js*
            priv/tracker/installation_support/*.js
          key: tracker-bundle-v1-${{ startsWith(env.MIX_ENV, 'ce') && 'ce' || 'ee' }}-${{ hashFiles('tracker/src/**', 'tracker/installation_support/**', 'tracker/compiler/**', 'tracker/compile.js', 'tracker/package.json', 'tracker/package-lock.json') }}
      - run: npm install --prefix ./tracker
        if: steps.tracker-cache.outputs.cache-hit != 'true'
      - run: npm run deploy --prefix ./tracker
        if: steps.tracker-cache.outputs.cache-hit != 'true'
      # Saved straight after the build, not at the end of the job, so the entry
      # can never miss files that later steps remove.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.tracker-cache.outputs.cache-hit != 'true'
        with:
          path: |
            priv/tracker/js/plausible*.js*
            priv/tracker/installation_support/*.js
          key: ${{ steps.tracker-cache.outputs.cache-primary-key }}

      - run: mix deps.get --only $MIX_ENV
      - run: mix compile --warnings-as-errors --all-warnings
      # The services have no health check, so the runner starts the job without
      # waiting for them and they boot while the steps above run.
      - name: Wait for Postgres and ClickHouse
        run: |
          timeout 120 bash -c 'until docker exec ${{ job.services.postgres.id }} pg_isready -h 127.0.0.1 -U postgres -q; do sleep 0.5; done'
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:8123/ping > /dev/null; do sleep 0.5; done'
      - run: mix do ecto.create, ecto.migrate
      - run: mix run -e "Tzdata.ReleaseUpdater.poll_for_update"

      - run: make minio
        if: env.MIX_ENV == 'test'
      - run: mix test --include slow --include minio --include migrations --max-failures 1 --warnings-as-errors --partitions 6
        if: env.MIX_ENV == 'test'
        env:
          MINIO_HOST_FOR_CLICKHOUSE: "172.17.0.1"
          MIX_TEST_PARTITION: ${{ matrix.mix_test_partition }}


      - run: mix test --include slow --include migrations --max-failures 1 --warnings-as-errors --partitions 6
        if: env.MIX_ENV == 'ce_test'
        env:
          MIX_TEST_PARTITION: ${{ matrix.mix_test_partition }}

      # One partition per env saves; the other five would build the same archive
      # only to lose the race for the key.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.mix_test_partition == 1
        with:
          path: |
            deps
            _build
            tracker/node_modules
            priv/tracker/js
            priv/tracker/installation_support
            ${{ env.PERSISTENT_CACHE_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  e2e:
    name: End-to-end tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      MIX_ENV: e2e_test
      BASE_URL: "http://localhost:8111"
    services:
      postgres:
        image: "postgres:18"
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
      clickhouse:
        image: clickhouse/clickhouse-server:25.11.5.8-alpine
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: build-cache
        with:
          path: |
            deps
            _build
            assets/node_modules
            tracker/node_modules
            priv/tracker/js
            priv/tracker/installation_support
            ${{ env.PERSISTENT_CACHE_DIR }}
          key: e2e-${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: |
            e2e-${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-${{ hashFiles('mix.lock') }}-
            e2e-${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-

      # The path list matches the caches saved before this workflow, so their
      # snapshots keep restoring (the cache version is a hash of the paths).
      # Those snapshots also carry the committed priv/tracker/js/p.js, so put
      # this commit's copy back.
      - run: git checkout -- priv/tracker

      - name: Cache E2E dependencies and Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: |
            e2e/node_modules
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-github
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Restore tracker bundle
        id: tracker-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            priv/tracker/js/plausible*.js*
            priv/tracker/installation_support/*.js
          key: tracker-bundle-v1-${{ startsWith(env.MIX_ENV, 'ce') && 'ce' || 'ee' }}-${{ hashFiles('tracker/src/**', 'tracker/installation_support/**', 'tracker/compiler/**', 'tracker/compile.js', 'tracker/package.json', 'tracker/package-lock.json') }}
      - run: npm install --prefix ./tracker
        if: steps.tracker-cache.outputs.cache-hit != 'true'
      - run: npm run deploy --prefix ./tracker
        if: steps.tracker-cache.outputs.cache-hit != 'true'
      # Saved straight after the build, not at the end of the job, so the entry
      # can never miss files that later steps remove.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.tracker-cache.outputs.cache-hit != 'true'
        with:
          path: |
            priv/tracker/js/plausible*.js*
            priv/tracker/installation_support/*.js
          key: ${{ steps.tracker-cache.outputs.cache-primary-key }}
      - run: mix deps.get --only $MIX_ENV
      - run: mix compile --warnings-as-errors --all-warnings
      - run: npm install --prefix ./assets
      - run: mix assets.deploy
      # The services have no health check, so the runner starts the job without
      # waiting for them and they boot while the steps above run.
      - name: Wait for Postgres and ClickHouse
        run: |
          timeout 120 bash -c 'until docker exec ${{ job.services.postgres.id }} pg_isready -h 127.0.0.1 -U postgres -q; do sleep 0.5; done'
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:8123/ping > /dev/null; do sleep 0.5; done'
      - run: mix do ecto.create, ecto.migrate
      - run: mix download_country_database
      - run: mix run -e "Tzdata.ReleaseUpdater.poll_for_update"

      - name: Install E2E dependencies
        run: npm --prefix ./e2e ci

      - name: Check format
        run: npm --prefix ./e2e run check-format

      - name: Check types
        run: npm --prefix ./e2e run typecheck

      - name: Install E2E Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      # `list` prints each shard's results in its own log, which makes the old
      # merge-reports job redundant. The blob keeps the traces of retried
      # (flaky) tests for download.
      - name: Run E2E Playwright tests
        run: npm --prefix ./e2e test -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=list,blob

      - name: Upload E2E blob report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-blob-report-${{ matrix.shardIndex }}
          path: e2e/blob-report
          retention-days: 7

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.shardIndex == 1
        with:
          path: |
            deps
            _build
            assets/node_modules
            tracker/node_modules
            priv/tracker/js
            priv/tracker/installation_support
            ${{ env.PERSISTENT_CACHE_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  static:
    name: Static checks (format, credo, dialyzer)
    env:
      MIX_ENV: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: build-cache
        with:
          path: |
            deps
            _build
            priv/plts
          key: static-${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: |
            static-${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-${{ hashFiles('mix.lock') }}-
            static-${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors --all-warnings
      - run: mix format --check-formatted
      - run: mix deps.unlock --check-unused
      - run: mix generate_countries_meta && git diff --exit-code -- assets/data/countries_meta.json
      - run: mix credo
      - run: mix dialyzer

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
