name: Check spelling

on:
  pull_request:
  push:
    branches: [ master ]
  merge_group:

permissions:
  contents: read

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: crate-ci/typos@2611abd15acb0c2e317fb9e45855aabb8b35a414 # v1.52.1
