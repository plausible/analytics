name: Check spelling

on:
  pull_request:
  push:
    branches: [ master ]
  merge_group:

permissions:
  contents: read

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
